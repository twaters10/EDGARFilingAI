[project]
name = "filing-copilot-mcp"
version = "0.1.0"
description = "Research assistant over SEC EDGAR filings: exact figures from XBRL via SQL, narrative from hybrid retrieval, grounded in enforced citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
fc = "filing_copilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
    "lxml-stubs>=0.5",
    "types-PyYAML>=6.0",
]
notebook = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pandas>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filing_copilot"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# pyarrow ships no py.typed marker. Scoped to pyarrow alone rather than setting
# ignore_missing_imports globally, which would silently mask a real missing
# dependency anywhere else in the project.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test hits a live service -- SEC EDGAR, local Ollama, or local OpenSearch\n    (deselected by default; run with -m network)",
]
addopts = "-m 'not network'"
