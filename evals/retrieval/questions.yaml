# Retrieval eval questions -- written BEFORE any search code runs against them.
#
# Discipline (PROJECT_PLAN.txt:802): a question written after watching the retriever
# fail is a question shaped by that failure. Write these from the personas, not from
# search results, and record `written_on` so the order is on the record.
#
# The corpus these must be answerable from (config/corpus.yaml):
#   * 10-K only, fiscal years 2023, 2024, 2025. No 10-Qs, no 8-Ks, no proxies.
#   * 20 filers: COF SYF AXP BFH ALLY SOFI (card / consumer) · JPM BAC C WFC
#     (money-center) · USB PNC TFC RF FITB CFG (regional) · V MA (networks) ·
#     JEF (investment bank) · AAPL (non-financial contrast)
#   * Sectioned items: 1 1A 1B 1C 2 3 5 7 7A 8 9A
#
# ---------------------------------------------------------------------------------
# SCHEMA -- one entry per question under `questions:`
#
#   id          str       stable, never reused: r001, r002, ...
#   question    str       exactly as a user would type it
#   persona     enum      credit_risk | card_intelligence | model_risk | aml
#   archetype   enum      lexical     -- hinges on an exact term, name, or item number
#                         semantic    -- the answer uses different words than the question
#                         entity      -- names one company (and often a year)
#                         peer        -- spans several companies; coverage matters
#   scope       map       what the question itself names; empty map if nothing.
#                           tickers: [SYF]   fiscal_years: [2024]   items: ["9A"]
#                         Recorded, NOT applied, through Phases 4-5: the query runs
#                         unfiltered so the eval sees what the raw retriever does.
#                         Phase 6 re-runs with scope applied as filters.
#   split       enum      dev | blind. ~20% blind, chosen before any run, run once.
#   written_on  date      YYYY-MM-DD
#   gold        list      EMPTY until Phase 4 (`fc label-span`). Each entry:
#                           accession, document, char_start, char_end,
#                           grade (1|2), source (initial|adjudicated), note
#   notes       str       optional: what a good answer contains, in your words
#
# TARGET MIX for ~30 (a guide, not a quota):
#   lexical 7 · semantic 7 · entity 10 · peer 6
#   and across personas, weighted to credit_risk and card_intelligence
#
# EXAMPLE -- illustrative only, kept in a comment so no loader ever reads it:
#
#   - id: r000
#     question: "What did Synchrony disclose about customer concentration risk?"
#     persona: credit_risk
#     archetype: entity
#     scope: {tickers: [SYF], fiscal_years: [2024], items: ["1A"]}
#     split: dev
#     written_on: 2026-09-24
#     gold: []
#     notes: "Dependence on a few retail partners; names the largest program(s)."
# ---------------------------------------------------------------------------------

# r001-r010 were drafted by Claude at the operator's request on 2026-09-24, before any
# search code existed, then reviewed by the operator. Edit or delete freely; every kept
# entry is the operator's call.
#
# Blind split: r006, r009, r014, r015, r017, r025 -- drawn 2026-09-24 by seeded random sample
# (seed 20260924), 20% per archetype, before any search code existed. Not hand-picked,
# so no guess about which questions are hard leaked into the choice. Run once, at the end.
# 2026-09-24: r001 moved to dev so it can serve as a Phase 1 probe; its replacement,
# r006, was drawn from the remaining dev entity questions with the same seed.

questions:
  - id: r001
    question: "What did Synchrony disclose about customer concentration risk?"
    persona: credit_risk
    archetype: entity
    scope: {tickers: [SYF], fiscal_years: [2024], items: ["1A"]}
    split: dev
    written_on: 2026-09-24
    gold: []
    notes: "Dependence on a few retail partners; names the largest program(s)."

  - id: r002
    question: "Did any company report a material weakness in internal control over financial reporting?"
    persona: model_risk
    archetype: lexical
    scope: {items: ["9A"]}
    split: dev
    written_on: 2026-09-24
    gold: []
