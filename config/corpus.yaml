  - ticker: USB
    cik: "0000036104"
    name: U.S. Bancorp
    group: regional_bank
    lender: true
  - ticker: PNC
    cik: "0000713676"
    name: PNC Financial Services Group, Inc.
    group: regional_bank
    lender: true
  - ticker: TFC
    cik: "0000092230"
    name: Truist Financial Corp
    group: regional_bank
    lender: true
  - ticker: RF
    cik: "0001281761"
    name: Regions Financial Corp
    group: regional_bank
    lender: true
  - ticker: FITB
    cik: "0000035527"
    name: Fifth Third Bancorp
    group: regional_bank
    lender: true
  - ticker: CFG
    cik: "0000759944"
    name: Citizens Financial Group Inc
    group: regional_bank
    lender: true

  # --- Networks and deliberate contrast filers ------------------------------
  # Non-lenders, included on purpose. They exercise the resolver's unhappy path
  # and supply the non-December fiscal year ends the alignment warning needs.
  - ticker: V
    cik: "0001403161"
    name: Visa Inc.
    group: card_network
    lender: false
  - ticker: MA
    cik: "0001141391"
    name: Mastercard Inc
    group: card_network
    lender: false
  - ticker: JEF
