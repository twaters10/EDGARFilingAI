  - ticker: JPM
    cik: "0000019617"
    name: JPMorgan Chase & Co
    group: money_center_bank
    lender: true
  - ticker: BAC
    cik: "0000070858"
    name: Bank of America Corp
    group: money_center_bank
    lender: true
  - ticker: C
    cik: "0000831001"
    name: Citigroup Inc
    group: money_center_bank
    lender: true
  - ticker: WFC
    cik: "0000072971"
    name: Wells Fargo & Company
    group: money_center_bank
    lender: true

  # --- Regional banks -------------------------------------------------------
