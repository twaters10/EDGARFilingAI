# The companies this project ingests. Corpus growth is a config change, not a
# code change -- add a row here and re-run ingestion.
#
# cik is the canonical 10-digit zero-padded form (see edgar/identifiers.py) and
# is quoted so YAML does not strip the leading zeros into an int. It is the join
# key everywhere downstream: tickers change hands, CIKs do not.
#
# `lender` drives the coverage-matrix thresholds. A card network or a technology
# company does not report an allowance for credit losses, and reporting that as
# a clean absence is correct behaviour, not a gap -- see docs/decisions/.
#
# Fiscal year ends are NOT recorded here. They are derived from the filed data
# during ingestion, because an assumption about a fiscal calendar that silently
# disagrees with the filings is exactly the bug this stage exists to prevent.

companies:
  # --- Card issuers and consumer lenders ------------------------------------
  # The domain the project targets. Dense credit disclosure, comparable peers.
  - ticker: COF
    cik: "0000927628"
    name: Capital One Financial Corp
    group: card_issuer
    lender: true
  - ticker: SYF
    cik: "0001601712"
    name: Synchrony Financial
    group: card_issuer
    lender: true
  - ticker: AXP
    cik: "0000004962"
    name: American Express Co
    group: card_issuer
    lender: true
  - ticker: BFH
    cik: "0001101215"
    name: Bread Financial Holdings, Inc.
    group: card_issuer
    lender: true
  - ticker: ALLY
    cik: "0000040729"
    name: Ally Financial Inc.
    group: consumer_lender
    lender: true
  - ticker: SOFI
    cik: "0001818874"
    name: SoFi Technologies, Inc.
    group: consumer_lender
    lender: true

  # --- Money-center banks ---------------------------------------------------
